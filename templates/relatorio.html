<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Gerencial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
    <h1>Relatório gerencial: mecânicos que mais realizaram serviços</h1>
    <table border="1">
        <tr>
            <th>Mecânico</th>
            <th>Especialidade</th>
            <th>Total de serviços</th>
            <th>Total de OS</th>
            <th>Faturamento</th>
        </tr>
        {% for r in relatorio %}
        <tr>
            <td>{{ r.mecanico }}</td>
            <td>{{ r.especialidade }}</td>
            <td>{{ r.total_servicos }}</td>
            <td>{{ r.total_os }}</td>
            <td>R$ {{ r.faturamento }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="actions">
        <a href="{{ url_for('index') }}">Voltar ao menu</a>
    </div>
    </div>
</body>
</html>
