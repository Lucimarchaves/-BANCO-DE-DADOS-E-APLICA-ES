<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
    <h1>Clientes cadastrados</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CPF/CNPJ</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Endereço</th>
        </tr>
        {% for c in clientes %}
        <tr>
            <td>{{ c.id_cliente }}</td>
            <td>{{ c.nome }}</td>
            <td>{{ c.cpf_cnpj }}</td>
            <td>{{ c.telefone or '' }}</td>
            <td>{{ c.email or '' }}</td>
            <td>{{ c.endereco or '' }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="actions">
        <a href="{{ url_for('cadastrar_cliente') }}">Cadastrar cliente</a>
        <a href="{{ url_for('index') }}">Voltar ao menu</a>
    </div>
    </div>
</body>
</html>
