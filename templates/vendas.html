<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
    <h1>Vendas realizadas</h1>
    <table border="1">
        <tr>
            <th>Data</th>
            <th>Placa</th>
            <th>Cliente</th>
            <th>Vendedor</th>
            <th>Valor</th>
            <th>Desconto</th>
        </tr>
        {% for v in vendas %}
        <tr>
            <td>{{ v.data_venda }}</td>
            <td>{{ v.placa }}</td>
            <td>{{ v.cliente }}</td>
            <td>{{ v.vendedor }}</td>
            <td>R$ {{ v.valor_venda }}</td>
            <td>R$ {{ v.desconto }}</td>
        </tr>
        {% endfor %}
    </table>

    <div class="actions">
        <a href="{{ url_for('listar_veiculos') }}">Voltar para veículos</a>
    </div>
    </div>
</body>
</html>
