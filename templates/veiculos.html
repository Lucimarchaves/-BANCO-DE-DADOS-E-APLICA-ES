<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos disponíveis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
    <h1>Veículos disponíveis para venda</h1>
    <table border="1">
        <tr>
            <th>Placa</th>
            <th>Marca</th>
            <th>Modelo</th>
            <th>Cor</th>
            <th>Valor anunciado</th>
            <th>Ações</th>
        </tr>
        {% for v in veiculos %}
        <tr>
            <td>{{ v.placa }}</td>
            <td>{{ v.marca }}</td>
            <td>{{ v.modelo }}</td>
            <td>{{ v.cor }}</td>
            <td>R$ {{ v.valor_anunciado }}</td>
            <td>
                <a href="{{ url_for('vender_veiculo', id_veiculo=v.id_veiculo) }}">
                    Vender
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
    <div class="actions">
        <a href="{{ url_for('listar_vendas') }}">Ver vendas</a>
    </div>
    </div>
</body>
</html>
